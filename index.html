<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080812">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="地推运维">
<meta name="mobile-web-app-capable" content="yes">
<title>地推运维 v16</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.L||document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>')</script>
<style>
:root{
  --bg:#080812;--card:#121224;--card2:#1a1a32;
  --accent:#00c2ff;--purple:#7b5cff;
  --text:#e0e0e8;--text2:#7a7a94;
  --mt:#ff9f1c;--gs:#3d7fff;
  --st-n:#1dd176;--st-f:#0ce6c4;--st-o:#ffb347;--st-e:#ff3b5c;
  --safe:env(safe-area-inset-bottom,16px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
#map{position:fixed;inset:0;z-index:1}

/* ── 顶栏 ── */
#tb{position:fixed;top:6px;left:8px;right:8px;z-index:1000;background:rgba(12,12,30,.94);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:5px 8px;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(16px);box-shadow:0 2px 16px rgba(0,0,0,.5)}
#tb .r{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 94%,transparent 100%)}
#tb .r::-webkit-scrollbar{display:none}
#tb .logo{font-size:15px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.4px;padding-right:4px}
#tb .logo span{color:var(--accent)}
#tb .tag{border-radius:8px;padding:3px 10px;font-size:11px;font-weight:600;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.07);color:var(--text2);transition:all .15s;line-height:18px;white-space:nowrap}
#tb .tag.on{color:#fff}
#tb .tag.b-mt.on{background:var(--mt);border-color:var(--mt)}
#tb .tag.b-gs.on{background:var(--gs);border-color:var(--gs)}
#tb .tag.b-pl.on{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12);color:var(--text2)}
#tb .tag.p-me.on{background:#7b5cff;border-color:#7b5cff}
#tb .tag.p-you.on{background:#00b8d4;border-color:#00b8d4}
#tb .tag.p-ta.on{background:#ff6b81;border-color:#ff6b81}
#tb .tag.s-n.on{background:var(--st-n);border-color:var(--st-n)}
#tb .tag.s-f.on{background:var(--st-f);border-color:var(--st-f)}
#tb .tag.s-o.on{background:var(--st-o);border-color:var(--st-o)}
#tb .tag.s-e.on{background:var(--st-e);border-color:var(--st-e)}
#tb .sep{width:1px;height:16px;background:rgba(255,255,255,.06);flex-shrink:0}
#tb .sbtn{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-left:auto;transition:all .15s}
#tb .sbtn:active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── 日期筛选行 ── */
#tb .dr{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
#tb .dr::-webkit-scrollbar{display:none}
#tb .dtag{border-radius:8px;padding:3px 9px;font-size:10px;font-weight:600;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.07);color:var(--text2);transition:all .15s;line-height:18px;white-space:nowrap}
#tb .dtag.on{background:rgba(0,194,255,.18);color:var(--accent);border-color:rgba(0,194,255,.3)}
#tb .dr .dr-custom{flex-shrink:0;display:flex;align-items:center;gap:2px}
#tb .dr .dr-custom input{width:72px;padding:2px 4px;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:var(--card2);color:var(--text);font-size:10px;outline:none}
#tb .dr .dr-custom span{font-size:10px;color:var(--text2)}

/* ── 计数 ── */
#cnt{position:fixed;top:98px;left:50%;transform:translateX(-50%);z-index:997;background:rgba(18,18,36,.88);border-radius:8px;padding:3px 12px;font-size:11px;color:var(--text2);border:1px solid rgba(255,255,255,.04);pointer-events:none;backdrop-filter:blur(8px)}
#cnt b{color:var(--accent)}

/* ── 右侧按钮 ── */
.rbtn{position:fixed;right:8px;z-index:997;width:30px;height:30px;border-radius:10px;background:rgba(18,18,36,.88);border:1px solid rgba(255,255,255,.05);color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:all .12s}
.rbtn:active{background:var(--card2)}
#lbtn{top:100px}#statbtn{top:136px}#todobtn{top:172px}

/* ── 右下角导出导入 ── */
#aux{position:fixed;bottom:calc(22px + var(--safe));right:16px;z-index:1000;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.aux-btn{height:28px;padding:0 10px;border-radius:8px;background:rgba(18,18,36,.88);border:1px solid rgba(255,255,255,.05);color:var(--text2);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;backdrop-filter:blur(8px);transition:all .12s;white-space:nowrap}
.aux-btn:active{color:var(--accent);border-color:var(--accent)}
.aux-btn .ab-ico{font-size:12px}

/* ── Overlay ── */
.ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(3px)}
.ov.open{opacity:1;pointer-events:auto}
.pn{width:100%;max-height:84vh;background:linear-gradient(180deg,var(--card) 0%,var(--bg) 100%);border-radius:16px 16px 0 0;padding:18px 14px calc(18px + var(--safe));box-shadow:0 -6px 24px rgba(0,0,0,.6);overflow-y:auto;transform:translateY(20px);transition:transform .18s;-webkit-overflow-scrolling:touch}
.ov.open .pn{transform:translateY(0)}
.pn h2{font-size:17px;margin-bottom:10px;font-weight:700}

/* ── 表单 ── */
.fg{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fg label{font-size:9px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg textarea{padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:var(--card2);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.fg input:focus,.fg textarea:focus{border-color:var(--accent)}
.tr{display:flex;gap:5px}
.tr3{display:flex;gap:5px}
.tgr{flex:1;padding:9px 2px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:var(--card2);text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--text2);transition:all .12s}
.tgr.sel{border-color:transparent;color:#fff}
.tgr.b-mt.sel{background:var(--mt)}.tgr.b-gs.sel{background:var(--gs)}
.tgr.p-me.sel{background:#7b5cff}.tgr.p-you.sel{background:#00b8d4}.tgr.p-ta.sel{background:#ff6b81}
.tgr.s-n.sel{background:var(--st-n)}.tgr.s-f.sel{background:var(--st-f)}
.tgr.s-o.sel{background:var(--st-o)}.tgr.s-e.sel{background:var(--st-e)}

/* ── 待办勾选 + 优先级 ── */
.pri-sel{display:flex;gap:4px;margin-bottom:6px}
.pri-btn{padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.06);background:var(--card2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s}
.pri-btn.sel{border-color:transparent}
.pri-btn.p1.sel{background:#ff3b5c;color:#fff}.pri-btn.p2.sel{background:#ffb347;color:#fff}.pri-btn.p3.sel{background:#1dd176;color:#fff}
.ch-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ch-item{flex:1;min-width:calc(50% - 6px);padding:11px 0;border-radius:9px;border:1px solid rgba(255,255,255,.06);background:var(--card2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .12s}
.ch-item:active{transform:scale(.97)}
.todo-chk{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--text2);cursor:pointer}
.todo-chk input{accent-color:var(--accent)}

/* ── 处理记录 ── */
.rl{display:flex;flex-direction:column;gap:5px;margin-bottom:6px;max-height:140px;overflow-y:auto}
.ri{background:var(--card2);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ri .rit{color:var(--text2);font-size:10px;flex-shrink:0;white-space:nowrap}
.ri .rix{color:var(--text);word-break:break-all;line-height:1.4}
.ri .rid{color:var(--st-e);font-size:11px;cursor:pointer;padding:0 3px;flex-shrink:0}
.ra{display:flex;gap:5px}
.ra input{flex:1;padding:9px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:var(--card2);color:var(--text);font-size:13px;outline:none}
.ra button{padding:9px 13px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}

/* ── 现场拍照 ── */
.photo-section{margin-bottom:8px}
.photo-section label{font-size:9px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px}
.photo-upload-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:8px;background:var(--card2);border:1px dashed rgba(0,194,255,.3);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;margin-bottom:6px}
.photo-upload-btn:active{background:rgba(0,194,255,.1)}
.photo-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.photo-thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .photo-del{position:absolute;top:0;right:0;width:16px;height:16px;border-radius:0 8px 0 8px;background:rgba(255,59,92,.85);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.photo-lightbox{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.photo-lightbox.open{opacity:1;pointer-events:auto}
.photo-lightbox img{max-width:96vw;max-height:90vh;border-radius:10px}
.photo-lightbox .pl-close{position:fixed;top:16px;right:16px;z-index:6001;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── 按钮 ── */
.btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}
.btn-dan{background:var(--st-e);color:#fff}
.btn-out{background:rgba(255,255,255,.03);color:var(--text);border:1px solid rgba(255,255,255,.06)}
.btn+.btn{margin-top:5px}

/* ── 今日待办面板 ── */
#todo-panel{position:fixed;inset:0;z-index:3500;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s}
#todo-panel.open{opacity:1;pointer-events:auto}
#todo-panel .tp-inner{width:100%;max-height:72vh;background:linear-gradient(180deg,var(--card) 0%,var(--bg) 100%);border-radius:16px 16px 0 0;padding:16px 14px calc(16px + var(--safe));box-shadow:0 -6px 24px rgba(0,0,0,.6);overflow-y:auto;transform:translateY(20px);transition:transform .18s;-webkit-overflow-scrolling:touch}
#todo-panel.open .tp-inner{transform:translateY(0)}
#todo-panel h3{text-align:center;margin-bottom:10px;font-size:16px;font-weight:700}
.tp-item{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:10px;margin-bottom:4px;background:var(--card2);border:1px solid rgba(255,255,255,.03);cursor:pointer;transition:all .12s}
.tp-item:active{background:rgba(0,194,255,.06)}
.tp-item.done{opacity:.4}
.tp-item .tp-pri{width:6px;height:28px;border-radius:3px;flex-shrink:0}
.tp-item .tp-cb{flex-shrink:0;width:20px;height:20px;accent-color:var(--accent)}
.tp-item .tp-info{flex:1;min-width:0}
.tp-item .tp-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-item .tp-meta{font-size:10px;color:var(--text2);margin-top:1px}
.tp-item .tp-actions{display:flex;gap:4px;flex-shrink:0}
.tp-item .tp-act-btn{width:26px;height:26px;border-radius:7px;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.tp-item .tp-act-btn.tp-nav{background:rgba(0,194,255,.12);color:var(--accent)}
.tp-item .tp-act-btn.tp-route{background:rgba(123,92,255,.12);color:var(--purple)}
.tp-empty{text-align:center;padding:28px 0;color:var(--text2);font-size:12px}
.tp-close{width:100%;padding:10px;margin-top:6px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}
.tp-log-hd{font-size:12px;font-weight:700;color:var(--text2);margin:14px 0 6px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.tp-log-item{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:5px;font-size:11px;line-height:1.5}
.tp-log-item .lg-time{color:var(--text2);font-size:10px}
.tp-log-item .lg-name{font-weight:600;color:var(--accent)}
.tp-log-item .lg-status{font-weight:600}
.tp-log-item .lg-note{color:var(--text2)}

/* ── 批量操作 ── */
#batch-bar{position:fixed;bottom:0;left:0;right:0;z-index:1500;background:rgba(18,18,36,.96);backdrop-filter:blur(18px);padding:10px 14px calc(10px + var(--safe));border-top:1px solid rgba(255,255,255,.06);display:none;flex-direction:column;gap:6px}
#batch-bar.show{display:flex}
#batch-bar .bb-top{display:flex;align-items:center;justify-content:space-between}
#batch-bar .bb-title{font-size:13px;font-weight:700;color:var(--text)}
#batch-bar .bb-clear{font-size:11px;color:var(--accent);cursor:pointer;font-weight:600}
#batch-bar .bb-actions{display:flex;gap:6px}
.bb-btn{flex:1;padding:9px 0;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;white-space:nowrap}
.bb-btn:active{transform:scale(.96)}
.bb-btn.bb-status{background:rgba(0,194,255,.12);color:var(--accent)}
.bb-btn.bb-person{background:rgba(123,92,255,.12);color:var(--purple)}
.bb-btn.bb-del{background:rgba(255,59,92,.12);color:var(--st-e)}
.batch-mode .rbtn,#batch-bar.show ~ .rbtn{display:none}
.marker-selected{filter:drop-shadow(0 0 6px var(--accent)) brightness(1.3)}

/* ── 路线规划面板 ── */
#route-panel{position:fixed;inset:0;z-index:4500;display:flex;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .18s}
#route-panel.open{opacity:1;pointer-events:auto}
#route-panel .rp-inner{width:100%;max-height:72vh;background:linear-gradient(180deg,var(--card) 0%,var(--bg) 100%);border-radius:16px 16px 0 0;padding:16px 14px calc(16px + var(--safe));box-shadow:0 -6px 24px rgba(0,0,0,.6);overflow-y:auto;transform:translateY(20px);transition:transform .18s;-webkit-overflow-scrolling:touch}
#route-panel.open .rp-inner{transform:translateY(0)}
#route-panel h3{text-align:center;margin-bottom:10px;font-size:16px;font-weight:700}
.rp-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.rp-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:var(--card2);border:1px solid rgba(255,255,255,.04);cursor:grab}
.rp-item .rp-idx{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#080812;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rp-item .rp-name{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-item .rp-remove{width:22px;height:22px;border-radius:50%;background:rgba(255,59,92,.15);color:var(--st-e);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:none}
.rp-item .rp-drag{color:var(--text2);font-size:14px;cursor:grab;flex-shrink:0}
.rp-plan-btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--purple),var(--accent));color:#fff;margin-bottom:4px;transition:all .12s}
.rp-plan-btn:active{transform:scale(.97)}
.rp-clear-btn{width:100%;padding:9px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}
.rp-empty{text-align:center;padding:22px 0;color:var(--text2);font-size:12px}
.rp-close{width:100%;padding:10px;margin-top:4px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}

/* ── 数据看板增强 ── */
#sov2{position:fixed;inset:0;z-index:4000;display:flex;align-items:flex-end;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .18s}
#sov2.open{opacity:1;pointer-events:auto}
#sov2 .si2{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:16px 12px calc(16px + var(--safe));transform:translateY(20px);transition:transform .18s;max-height:72vh;overflow-y:auto}
#sov2.open .si2{transform:translateY(0)}
#sov2 h3{text-align:center;margin-bottom:12px;font-size:16px;font-weight:700}
.sx{width:100%;padding:10px;margin-top:8px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer}

/* 看板卡片 */
.db-card{background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.03)}
.db-card-title{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.db-kpi-row{display:flex;gap:8px;margin-bottom:8px}
.db-kpi{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:rgba(255,255,255,.02)}
.db-kpi .db-kpi-val{font-size:20px;font-weight:800;color:var(--accent)}
.db-kpi .db-kpi-label{font-size:9px;color:var(--text2);margin-top:2px}

/* 简易柱状图 */
.db-bar-chart{display:flex;align-items:flex-end;gap:3px;height:80px;padding-top:4px}
.db-bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end}
.db-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;transition:height .3s}
.db-bar-label{font-size:8px;color:var(--text2);margin-top:2px;white-space:nowrap}

/* 饼图 - conic-gradient */
.db-pie-wrap{display:flex;align-items:center;gap:12px;margin-top:4px}
.db-pie{width:90px;height:90px;border-radius:50%;flex-shrink:0}
.db-pie-legend{display:flex;flex-direction:column;gap:4px;flex:1}
.db-pie-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.db-pie-legend-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}

/* 趋势迷你图 */
.db-trend-row{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}

.day-sub{flex:1;font-size:10px;color:var(--text2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-total{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--text2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-item.has .day-total{background:rgba(0,194,255,.15);color:var(--accent)}
.day-det{display:none;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.05)}
.day-det .dd{font-size:11px;color:var(--text2);padding:2px 0;line-height:1.5;word-break:break-all}
.day-det .dd b{color:var(--text);font-weight:600}
.day-det .dd.add b{color:var(--accent)}
.day-det .dd.rec b{color:var(--st-n)}

<script>

const AK='adb2279ddafc64e73ace3126eb1e3428';

// ===== 固定存储Key —— 不再随版本号变化 =====
const LK='ditui_yunwei_data';

// ===== 默认示例数据 =====

  ];
  pts=pts.map(ensureFields);

// ===== 文件持久化（File System Access API） =====
let _dfh=null;
async function _initFile(){
  try{
    const db=await new Promise((r,j)=>{const q=indexedDB.open('ditui_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
    const h=await new Promise((r,j)=>{const t=db.transaction('h','readonly');const q=t.objectStore('h').get('df');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
    if(h){_dfh=h}
  }catch(e){}
  if(_dfh){
    try{
      const f=await _dfh.getFile();const t=await f.text();
      localStorage.setItem(LK,t);mg();
      return;
    }catch(e){_dfh=null}
  }
  // 没有文件句柄：localStorage 兜底
  mg();
  if(pts.length===0&&!localStorage.getItem(LK)){_genDefaults();sv();}
}
async function _writeFile(){
  if(!_dfh)return;
  try{
    const o={mode:'readwrite'};
    if((await _dfh.queryPermission(o))!=='granted'){
      if((await _dfh.requestPermission(o))!=='granted')return;
    }
    const w=await _dfh.createWritable();
    await w.write(JSON.stringify({v:1,pts:pts,aP:[...aP],aB:[...aB],aS:[...aS],logs:_logs},null,2));
    await w.close();
  }catch(e){}
}

// 状态变更日志
let _logs=[];
const SS={正常:'●',满仓:'◆',离线:'◐',空仓:'○'};

// ===== 工具函数 =====
const _ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>_ESC_MAP[c])}
function _pad2(n){return String(n).padStart(2,'0')}
function _dayKey(d){return d.getFullYear()+'/'+_pad2(d.getMonth()+1)+'/'+_pad2(d.getDate())}
function _timeDayKey(s){
  if(!s)return '';
  const m=String(s).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  return m?m[1]+'/'+_pad2(+m[2])+'/'+_pad2(+m[3]):'';
}
function _addLog(pointId,pointName,fromStatus,toStatus,note){
  _logs.push({
    id:'lg_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    time:new Date().toLocaleString('zh-CN'),
    pointId:pointId,pointName:pointName,
    fromStatus:fromStatus,toStatus:toStatus,note:note||''
  });
}

function ensureFields(p){
  if(p.todo===undefined) p.todo=false;
  if(p.priority===undefined) p.priority=2;
  if(!p.photos) p.photos=[];
  if(!p.time) p.time=new Date().toLocaleString('zh-CN');
  if(!p.records) p.records=[];
  return p;
}

// ===== 日期筛选 =====
function isInDateRange(p){
  if(dateRange.mode==='all') return true;
  if(!p.time) return true;
  const d=new Date(p.time.replace(/\//g,'-'));
  if(isNaN(d)) return true;
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(dateRange.mode==='today'){
    return d>=today && d<new Date(today.getTime()+86400000);
  }
  if(dateRange.mode==='week'){
    const wkStart=new Date(today);
    wkStart.setDate(today.getDate()-today.getDay());
    const wkEnd=new Date(wkStart.getTime()+7*86400000);
    return d>=wkStart && d<wkEnd;
  }
  if(dateRange.mode==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(dateRange.mode==='custom'){
    if(!dateRange.start) return true;
    const s=new Date(dateRange.start+'T00:00:00');
    const e=dateRange.end?new Date(dateRange.end+'T23:59:59'):new Date('2099-12-31');
    return d>=s && d<=e;
  }
  return true;
}

function gf(){
  return pts.filter(p=>aP.has(p.person||'我')&&aB.has(p.brand||'美团')&&aS.has(p.status||'正常')&&isInDateRange(p));

function uploadPhotos(event){
  const p=pts.find(x=>x.id===di);if(!p)return;
  if(!p.photos) p.photos=[];
  const files=event.target.files;
  if(!files||!files.length) return;
  let loaded=0;
  Array.from(files).forEach(f=>{
    const reader=new FileReader();
    reader.onload=function(e){
      let dataUrl=e.target.result;
      // 压缩：缩小尺寸
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const MAX=800;
        if(w>MAX||h>MAX){const r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r)}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const compressed=canvas.toDataURL('image/jpeg',0.6);
        p.photos.push(compressed);
        loaded++;
        if(loaded===files.length){sv();renderPhotos(p);rm();st('照片已保存')}
      };
      img.src=dataUrl;
    };
    reader.readAsDataURL(f);
  });
  event.target.value='';
}

/* ── 路线规划 ── */
function orp(){

  document.getElementById('route-panel').classList.remove('open');
}

function renderRoutePanel(){
  const el=document.getElementById('rp-list');
  if(!routeIds.length){el.innerHTML='<div class="rp-empty">点击待办中 "+路线" 或详情中 "+路线" 添加</div>';return}
  el.innerHTML=routeIds.map((id,i)=>{
    const p=pts.find(x=>x.id===id);
    if(!p) return '';
    return`<div class="rp-item" draggable="true" data-idx="${i}" ondragstart="rpDragStart(event,${i})" ondragover="rpDragOver(event)" ondrop="rpDrop(event,${i})">
      <div class="rp-idx">${i+1}</div>
      <div class="rp-drag">⠿</div>
      <div class="rp-name">${esc(p.name)}</div>
      <button class="rp-remove" onclick="rpRemove('${id}')">✕</button>
    </div>`;
  }).join('');
}

let rpDragIdx=null;
function rpDragStart(e,idx){rpDragIdx=idx;e.dataTransfer.effectAllowed='move';}
function rpDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function rpDrop(e,idx){
  e.preventDefault();
  if(rpDragIdx===null||rpDragIdx===idx) return;
  const item=routeIds.splice(rpDragIdx,1)[0];
  routeIds.splice(idx,0,item);
  rpDragIdx=null;
  renderRoutePanel();
  drawRouteLine();
}

function rpRemove(id){
  routeIds=routeIds.filter(x=>x!==id);
  renderRoutePanel();
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}
  st('已从路线移除');
}

function drawRouteLine(){
  if(routeLine) map.removeLayer(routeLine);
  const coords=routeIds.map(id=>{const p=pts.find(x=>x.id===id);return p?[p.lat,p.lng]:null}).filter(Boolean);
  if(coords.length<2) return;
  routeLine=L.polyline(coords,{color:'#00c2ff',weight:3,dashArray:'8,8',opacity:0.8}).addTo(map);
  map.fitBounds(L.latLngBounds(coords),{padding:[40,40]});
}

async function planRoute(){
  if(routeIds.length<2){st('至少添加2个点','w');return}
  const coords=routeIds.map(id=>{const p=pts.find(x=>x.id===id);return p?{lng:p.lng,lat:p.lat}:null}).filter(Boolean);
  const origin=coords[0],dest=coords[coords.length-1];
  const wp=coords.slice(1,-1).map(c=>c.lng+','+c.lat).join(';');
  // 尝试高德驾车路径规划 API
  try{
    const url=`https://restapi.amap.com/v3/direction/driving?key=${AK}&origin=${origin.lng},${origin.lat}&destination=${dest.lng},${dest.lat}${wp?'&waypoints='+wp:''}&strategy=2&extensions=all`;
    const resp=await fetch(url);
    const data=await resp.json();
    if(data.status==='1'&&data.route&&data.route.paths){
      const path=data.route.paths[0];
      const polyline=path.steps.flatMap(s=>s.polyline.split(';').map(c=>{const [lng,lat]=c.split(',');return [parseFloat(lat),parseFloat(lng)]}));
      if(routeLine) map.removeLayer(routeLine);
      routeLine=L.polyline(polyline,{color:'#7b5cff',weight:4,opacity:0.85}).addTo(map);
      map.fitBounds(L.latLngBounds(polyline),{padding:[40,40]});
      st('路线规划完成');
      return;
    }
  }catch(e){}
  // 降级：直接连线
  drawRouteLine();
  st('已用直线连接路线点');
}

/* ── GPS 定位 ── */

function _showMyLoc(lat,lng,label,zoom){
  if(!map) return;
  map.setView([lat,lng],zoom);
  L.circleMarker([lat,lng],{radius:7,color:'#00c2ff',fillColor:'#00c2ff',fillOpacity:.3,weight:2.5}).addTo(map).bindPopup(label).openPopup();
  document.getElementById('lbtn').style.opacity='1';
}

function lm(){
  const btn=document.getElementById('lbtn');
  btn.style.opacity='.4';st('定位中...');
  let done=false;
  const ok=(lat,lng,label,zoom,msg)=>{ if(done)return; done=true; _showMyLoc(lat,lng,label,zoom); if(msg)st(msg); };
  const fail=()=>{ if(done)return; done=true; _ipLocate(); };
  // 非 HTTPS（file:// 或 http://）时手机浏览器会禁用精确GPS，直接走网络定位，避免白等
  const canGps=window.isSecureContext&&location.protocol!=='file:'&&navigator.geolocation;
  if(canGps){
    try{
      navigator.geolocation.getCurrentPosition(p=>{
        const[ln,l]=wgs84ToGcj02(p.coords.longitude,p.coords.latitude);
        ok(l,ln,'📍 我的位置',17,'已定位');
      },fail,{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
      // 安全网：个别 WebView 既不成功也不回调错误，强制走网络定位
      setTimeout(fail,9000);
    }catch(e){ fail(); }
  }else{
    fail();
  }
}

// 网络定位兜底：高德 IP（JSONP）→ 通用 IP（fetch），均为城市级
let _ipCbId=0;
function _ipLocate(){
  st('正在网络定位...',null,true);
  _amapIp().then(ok=>ok?true:_foreignIp()).then(ok=>{
    if(!ok) _locateFail('网络异常，请检查网络后重试');
  }).catch(()=>_locateFail('网络异常，请检查网络后重试'));
}
function _locateFail(msg){
  document.getElementById('lbtn').style.opacity='1';
  st('定位失败：'+msg,'w');
}
function _amapIp(){
  return new Promise(resolve=>{
    const cb='_ipCb'+(_ipCbId++);
    const s=document.createElement('script');
    let done=false,timer=null;
    const cleanup=()=>{ try{delete window[cb]}catch(e){} try{s.remove()}catch(e){} };
    const settle=v=>{ if(done)return; done=true; if(timer)clearTimeout(timer); cleanup(); resolve(v); };
    timer=setTimeout(()=>settle(false),4000);
    window[cb]=function(data){
      if(data&&data.status==='1'&&data.rectangle){
        const v=data.rectangle.split(/[;,]/).map(Number);
        if(v.length>=4&&v.every(n=>!isNaN(n))){
          _showMyLoc((v[1]+v[3])/2,(v[0]+v[2])/2,'📍 大致位置（IP定位）',13);
          st('已用网络IP定位（城市级，精度有限）');
          settle(true);
          return;
        }
      }
      settle(false);
    };
    s.src=`https://restapi.amap.com/v3/ip?key=${AK}&callback=${cb}`;
    s.onerror=()=>settle(false);
    document.head.appendChild(s);
  });
}
function _foreignIp(){
  return new Promise(resolve=>{
    if(typeof fetch!=='function'){resolve(false);return}
    let ctrl=null,t=null;
    try{ ctrl=new AbortController(); t=setTimeout(()=>ctrl.abort(),5000); }catch(e){}
    fetch('https://ipwho.is/', ctrl?{signal:ctrl.signal}:{}).then(r=>r.json()).then(d=>{
      if(t)clearTimeout(t);
      if(d&&typeof d.latitude==='number'&&typeof d.longitude==='number'){
        const[ln,l]=wgs84ToGcj02(d.longitude,d.latitude);
        _showMyLoc(l,ln,'📍 大致位置（网络定位）',13);
        st('已用网络定位（城市级，精度有限）');
        resolve(true);
      }else resolve(false);
    }).catch(()=>{ if(t)clearTimeout(t); resolve(false); });
  });
}

/* ── 每日活动聚合 ── */
const _WD=['日','一','二','三','四','五','六'];
function _buildDaily(days){
  const bucket={};
  const g=k=>(bucket[k]||(bucket[k]={added:[],recs:[],sts:[]}));
  pts.forEach(p=>{const k=_timeDayKey(p.time);if(k)g(k).added.push(p.name||'未命名')});
  pts.forEach(p=>(p.records||[]).forEach(r=>{const k=_timeDayKey(r.time);if(k)g(k).recs.push({n:p.name||'未命名',t:r.text||''})}));
  _logs.forEach(l=>{const k=_timeDayKey(l.time);if(k)g(k).sts.push({n:l.pointName||'',f:l.fromStatus||'',t:l.toStatus||'',note:l.note||''})});
  const now=new Date(),arr=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const key=_dayKey(d),e=bucket[key]||{added:[],recs:[],sts:[]};
    arr.push({key,date:(d.getMonth()+1)+'/'+d.getDate(),wd:_WD[d.getDay()],added:e.added,recs:e.recs,sts:e.sts,total:e.added.length+e.recs.length+e.sts.length});
  }
  return arr;
}

/* ── 统计 + 数据看板增强 ── */
function ss2(){
  const PERS=['我','你','他'],BRDS=['美团','怪兽'],STS=['正常','满仓','离线','空仓'];
  function c(p,b,s){
    return pts.filter(x=>(!p||(x.person||'我')===p)&&(!b||(x.brand||'美团')===b)&&(!s||(x.status||'正常')===s)).length;
  }
  function render(filter){
    let h='';
    h+=`<div class="st-tabs">${['全部',...PERS].map(x=>`<div class="st-tab${x===filter?' on':''}" onclick="window._ssr('${x}')">${x}</div>`).join('')}</div>`;

    // ===== 每日活动（近30天） =====
    const daily=_buildDaily(30);
    h+='<div class="db-card"><div class="db-card-title">每日活动 · 近30天</div>';
    daily.forEach((x,i)=>{
      const subs=[];
      if(x.added.length)subs.push('新增'+x.added.length);
      if(x.recs.length)subs.push('记录'+x.recs.length);
      if(x.sts.length)subs.push('状态'+x.sts.length);
      let det='';
      if(x.total){
        det=x.added.map(a=>'<div class="dd add"><b>新增</b> '+esc(a)+'</div>').join('')
           +x.recs.map(r=>'<div class="dd rec"><b>记录</b> '+esc(r.n)+'：'+esc(r.t)+'</div>').join('')
           +x.sts.map(s=>'<div class="dd st"><b>状态</b> '+esc(s.n)+' '+esc(s.f)+'→'+esc(s.t)+(s.note?'（'+esc(s.note)+'）':'')+'</div>').join('');
      }
      h+='<div class="day-item'+(x.total?' has':'')+'" onclick="_tglDay('+i+')"><div class="day-row"><span class="day-date">'+x.date+'<small>周'+x.wd+'</small></span><span class="day-sub">'+(subs.length?subs.join(' · '):'无活动')+'</span><span class="day-total">'+x.total+'</span></div>'+(det?'<div class="day-det" id="daydet-'+i+'">'+det+'</div>':'')+'</div>';
    });
    h+='</div>';

    // ===== 数据看板增强 =====
    const todayKey=_dayKey(new Date());
    const todayNew=pts.filter(p=>_timeDayKey(p.time)===todayKey).length;

    // 本周每日新增趋势
    const now=new Date(),weekStart=new Date(now);
    weekStart.setDate(now.getDate()-now.getDay());
    const weekDays=['日','一','二','三','四','五','六'];
    let weekData=[];
    for(let i=0;i<7;i++){
      const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
      const key=_dayKey(d);
      const cnt=pts.filter(p=>_timeDayKey(p.time)===key).length;
      weekData.push({label:'周'+weekDays[d.getDay()],cnt,full:key});
    }
    const maxWeek=Math.max(...weekData.map(x=>x.cnt),1);

    // 最近7天处理记录
    let recData=[];
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const key=_dayKey(d);
      let recCnt=0;
      pts.forEach(p=>(p.records||[]).forEach(r=>{if(_timeDayKey(r.time)===key)recCnt++}));
      recData.push({label:d.getMonth()+1+'/'+d.getDate(),cnt:recCnt});
    }
    const maxRec=Math.max(...recData.map(x=>x.cnt),1);

    // 状态分布
    const stCnt=STS.map(s=>({label:s,cnt:c(null,null,s),color:ST[s]}));
    const totalSt=stCnt.reduce((a,b)=>a+b.cnt,0);
    const pieDeg=totalSt?stCnt.map(x=>(x.cnt/totalSt*360)).map((d,i)=>({...stCnt[i],deg:d})):[];
    let cumDeg=0;
    const pieStops=pieDeg.map(x=>{const s=`${x.color} ${cumDeg}deg ${cumDeg+x.deg}deg`;cumDeg+=x.deg;return s}).join(', ');

    // 品牌分布
    const brCnt=BRDS.map(b=>({label:b,cnt:c(null,b,null),color:BR[b]}));
    const totalBr=brCnt.reduce((a,b)=>a+b.cnt,0);
    const brPieDeg=totalBr?brCnt.map(x=>(x.cnt/totalBr*360)).map((d,i)=>({...brCnt[i],deg:d})):[];
    let cumDeg2=0;
    const brPieStops=brPieDeg.map(x=>{const s=`${x.color} ${cumDeg2}deg ${cumDeg2+x.deg}deg`;cumDeg2+=x.deg;return s}).join(', ');

    // 归属分布
    const psCnt=PERS.map(p=>({label:p,cnt:c(p,null,null),color:PR[p]}));
    const totalPs=psCnt.reduce((a,b)=>a+b.cnt,0);
    const psPieDeg=totalPs?psCnt.map(x=>(x.cnt/totalPs*360)).map((d,i)=>({...psCnt[i],deg:d})):[];
    let cumDeg3=0;
    const psPieStops=psPieDeg.map(x=>{const s=`${x.color} ${cumDeg3}deg ${cumDeg3+x.deg}deg`;cumDeg3+=x.deg;return s}).join(', ');

    // 待办统计

    </div>`;

    h+=`<div class="db-card">
      <div class="db-card-title">品牌分布</div>
      <div class="db-pie-wrap">
        <div class="db-pie" style="background:${totalBr?`conic-gradient(${brPieStops})`:'rgba(255,255,255,.05)'}"></div>

          ${brCnt.map(x=>`<div class="db-pie-legend-item"><div class="db-pie-legend-dot" style="background:${x.color}"></div>${x.label} <b>${x.cnt}</b></div>`).join('')}
        </div>
      </div>
    </div>`;

    h+=`<div class="db-card">
      <div class="db-card-title">归属分布</div>
      <div class="db-pie-wrap">
        <div class="db-pie" style="background:${totalPs?`conic-gradient(${psPieStops})`:'rgba(255,255,255,.05)'}"></div>

          ${psCnt.map(x=>`<div class="db-pie-legend-item"><div class="db-pie-legend-dot" style="background:${x.color}"></div>${x.label} <b>${x.cnt}</b></div>`).join('')}
        </div>
      </div>
    </div>`;

    // 原有详细统计
    if(filter==='全部'){
      h+=`<div class="st-sum" style="margin-top:12px">总计 <b>${pts.length}</b> 个运维点</div>`;
      h+=`<div class="st-grid3">`;

        h+=`<div class="st-pcard"><div class="st-phead" style="background:${PR[p]}22;color:${PR[p]}">${p} · ${c(p)}</div>`;
        BRDS.forEach(b=>{
          h+=`<div class="st-bcard"><div class="st-bname" style="color:${BR[b]}">${b} <b>${c(p,b)}</b></div><div class="st-brow">`;
          STS.forEach(s=>{const v=c(p,b,s);h+=`<span class="st-chip${v?' on':''}" style="${v?`background:${ST[s]}22;color:${ST[s]}`:''}">${s} ${v}</span>`;});
          h+=`</div></div>`;
        });
        h+=`</div>`;
      });
      h+=`</div>`;
    }else{
      h+=`<div class="st-sum" style="margin-top:12px"><span style="color:${PR[filter]}">${filter}</span> · <b>${c(filter)}</b> 个运维点</div>`;
      h+=`<div class="st-grid2">`;
      BRDS.forEach(b=>{
        h+=`<div class="st-bcard2"><div class="st-bname" style="color:${BR[b]}">${b} <b>${c(filter,b)}</b></div>`;
        STS.forEach(s=>{const v=c(filter,b,s);h+=`<div class="st-row"><span class="st-sdot" style="background:${ST[s]}"></span><span class="st-sname">${s}</span><span class="st-sval">${v}</span></div>`;});
        h+=`</div>`;
      });
      h+=`</div>`;
    }
    document.getElementById('sbody').innerHTML=h;
  }
  window._ssr=render;
  render('全部');
  document.getElementById('sov2').classList.add('open');
}

/* ── 坐标转换：WGS-84 → GCJ-02（高德API location参数需要GCJ-02）── */
function wgs84ToGcj02(lng,lat){
  const a=6378245.0,ee=0.00669342162296594323;
  function tL(x,y){
    let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
    return r;
  }
  function tA(x,y){
    let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
    return r;
  }
  const rad=lat/180*Math.PI,m=1-ee*Math.sin(rad)*Math.sin(rad),sm=Math.sqrt(m);
  const dLng=tL(lng-105,lat-35)*180/(a/sm*Math.cos(rad)*Math.PI);
  const dLat=tA(lng-105,lat-35)*180/(a*(1-ee)/(m*sm)*Math.PI);
  const rLng=lng+dLng,rLat=lat+dLat;
  // 迭代修正
  const rad2=rLat/180*Math.PI,m2=1-ee*Math.sin(rad2)*Math.sin(rad2),sm2=Math.sqrt(m2);
  const dLng2=tL(rLng-105,rLat-35)*180/(a/sm2*Math.cos(rad2)*Math.PI);
  const dLat2=tA(rLng-105,rLat-35)*180/(a*(1-ee)/(m2*sm2)*Math.PI);
  return[rLng+(lng-(rLng-dLng2)),rLat+(lat-(rLat-dLat2))];
}

/* ── POI 搜索（高德 place/text，精确POI）── */
let _poiCbId=0, _poiActiveCb=null, _poiActiveScript=null;

function _cancelPoiRequest(){
  if(_poiActiveScript){_poiActiveScript.remove();_poiActiveScript=null;}
  if(_poiActiveCb){delete window[_poiActiveCb];_poiActiveCb=null;}
}

function _renderPoiResults(el,items){
  // 高德瓦片+高德API均为GCJ-02，直接使用
  if(!items.length){el.innerHTML='<div class="sn">未找到匹配结果</div>';return}
  el.innerHTML=items.map(t=>{
    const nm=t.name||'',addr=t.address||'',dist=t.district||t.adname||'';
    const nmE=esc(nm),adE=esc(addr),dtE=esc(dist);
    const parts=t.location.split(',');
    const lng=parseFloat(parts[0]),lat=parseFloat(parts[1]);
    return`<div class="sr sr-poi" data-lat="${lat}" data-lng="${lng}" data-valid="1" data-name="${nmE}" data-addr="${adE}"><div class="sric">📍</div><div class="srb"><div class="srn">${nmE}</div><div class="srs">${adE||''}</div></div><span class="srp-dist">${dtE||''}</span></div>`;
  }).join('');
  document.querySelectorAll('#sl .sr').forEach(r=>r.onclick=function(){
    const la=parseFloat(this.dataset.lat),ln=parseFloat(this.dataset.lng);
    const nm=this.dataset.name||'',addr=this.dataset.addr||'';
    if(window._searchForForm){
      cs();
      pLa=la;pLn=ln;
      document.getElementById('fn').value=nm;
      document.getElementById('fa').value=addr;
      cf();
      of(la,ln);
      window._searchForForm=false;
      return;
    }
    // 橙色标记 + 直接弹表单
    if(window._searchMarker) map.removeLayer(window._searchMarker);
    window._searchMarker=L.marker([la,ln],{
      icon:L.divIcon({html:'<div style="width:22px;height:22px;border-radius:50%;background:var(--st-o);border:3px solid #fff;box-shadow:0 2px 10px rgba(255,179,71,.6)"></div>',iconSize:[22,22],iconAnchor:[11,11]})
    }).addTo(map).bindPopup(`<b>${nm}</b><br>${addr||''}`).openPopup();
    document.getElementById('fn').value=nm;
    document.getElementById('fa').value=addr;
    of(la,ln);
    map.setView([la,ln],17);cs();
  });
}

function searchPOI(keyword){
  _cancelPoiRequest();
  const el=document.getElementById('sl');
  if(!keyword.trim()){el.innerHTML='<div class="sn">输入地点名称搜索</div>';return}
  el.innerHTML='<div class="sn" style="opacity:.6">搜索中...</div>';
  const cb='_poiCb'+(_poiCbId++);
  _poiActiveCb=cb;
  window[cb]=function(data){
    delete window[cb];
    document.getElementById('_poiScript'+cb)?.remove();
    if(cb!==_poiActiveCb)return;
    _poiActiveCb=null;_poiActiveScript=null;
    if(data.status==='1'&&data.pois&&data.pois.length){
      _renderPoiResults(el,data.pois.filter(t=>t.location&&t.location.includes(',')));
    }else{el.innerHTML='<div class="sn">未找到匹配地点</div>'}
  };
  const s=document.createElement('script');
  _poiActiveScript=s;
  s.id='_poiScript'+cb;
  s.src=`https://restapi.amap.com/v3/place/text?key=${AK}&keywords=${encodeURIComponent(keyword)}&offset=20&output=JSON&callback=${cb}`;
  s.onerror=function(){delete window[cb];s.remove();el.innerHTML='<div class="sn" style="color:#ff6b81">搜索加载失败</div>'};
  document.head.appendChild(s);
}

function fm(t,q){
  if(!q)return 1;const tx=t.toLowerCase(),qx=q.toLowerCase();
  if(tx.includes(qx))return 2;
  let qi=0;for(let i=0;i<tx.length&&qi<qx.length;i++){if(tx[i]===qx[qi])qi++}
  return qi===qx.length?1:0;
}

function spRec(query){
  if(!query.trim())return gf();
  const q=query.trim();
  return gf().map(p=>({p,sc:fm(p.name+' '+p.addr,q)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.p);
}

function renderRecResults(q){
  const el=document.getElementById('sl'),r=spRec(q);
  if(!r.length){el.innerHTML='<div class="sn">未找到匹配的运维点</div>';return}
  el.innerHTML=r.map(p=>{
    const bc=BR[p.brand]||BR['美团'],sc=ST[p.status]||ST['正常'],pc=PR[p.person]||PR['我'],sm=SS[p.status]||'●';
    return`<div class="sr" data-id="${p.id}"><div class="sric" style="background:${bc};border:2px solid ${sc}">${sm}</div><div class="srb"><div class="srn">${esc(p.name)}</div><div class="srs">${esc(p.person||'我')} · ${esc(p.brand||'美团')} · ${esc(p.status||'正常')} · ${(p.records||[]).length}条记录${p.todo?' · ☑待办':''}</div></div><span class="srt" style="background:${pc}22;color:${pc}">${esc(p.person)}</span></div>`;
  }).join('');
  document.querySelectorAll('#sl .sr').forEach(el=>el.onclick=function(){cs();sd(this.dataset.id)});
}
